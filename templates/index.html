<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAKHI — SPMVV Campus Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f9f0ff 0%, #fce4f3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 32px;
      color: #7b2d8b;
      letter-spacing: 2px;
    }

    .header p {
      color: #a06db5;
      font-size: 13px;
      margin-top: 4px;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(123,45,139,0.15);
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #7b2d8b, #c2185b);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .chat-header-info h3 { color: white; font-size: 16px; }
    .chat-header-info p { color: rgba(255,255,255,0.7); font-size: 11px; }

    .online-dot {
      width: 8px;
      height: 8px;
      background: #4caf50;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    #chatbox {
      height: 420px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #fdf8ff;
    }

    #chatbox::-webkit-scrollbar { width: 4px; }
    #chatbox::-webkit-scrollbar-track { background: transparent; }
    #chatbox::-webkit-scrollbar-thumb { background: #d4a0e0; border-radius: 4px; }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      background: linear-gradient(135deg, #7b2d8b, #c2185b);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .sakhi {
      background: white;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .typing-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #a06db5;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .quick-questions {
      padding: 10px 20px 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: #fdf8ff;
      border-top: 1px solid #f0e0f8;
    }

    .quick-btn {
      background: #f0e0f8;
      color: #7b2d8b;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .quick-btn:hover { background: #e0b8f0; }

    .input-area {
      padding: 16px;
      background: white;
      border-top: 1px solid #f0e0f8;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #userinput {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1.5px solid #e0b8f0;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
      font-family: 'Segoe UI', sans-serif;
    }

    #userinput:focus { border-color: #7b2d8b; }

    #sendbtn {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #7b2d8b, #c2185b);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    #sendbtn:hover { transform: scale(1.08); }
  </style>
</head>
<body>

  <div class="header">
    <h1>🌸 SAKHI</h1>
    <p>Your Smart Campus Friend — SPMVV Tirupati</p>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🌸</div>
      <div class="chat-header-info">
        <h3>SAKHI</h3>
        <p><span class="online-dot"></span>Always here for you</p>
      </div>
    </div>

    <div id="chatbox">
      <div class="msg sakhi">Hi! I'm SAKHI 🌸 Your campus friend at SPMVV. Ask me anything about departments, hostel, mess, syllabus, or campus navigation!</div>
    </div>

    <div class="quick-questions">
      <button class="quick-btn" onclick="quickAsk('Hostel fee?')">Hostel fee</button>
      <button class="quick-btn" onclick="quickAsk('What departments are in SPMVV?')">Departments</button>
      <button class="quick-btn" onclick="quickAsk('I am a new student, what do I do first?')">New student guide</button>
      <button class="quick-btn" onclick="quickAsk('What scholarships are available?')">Scholarships</button>
      <button class="quick-btn" onclick="openComplaint()" style="background:#fce4ec;color:#c2185b;">🚨 Submit Complaint</button>
    </div>

    <div class="input-area">
      <input type="text" id="userinput" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter') sendMessage()"/>
      <button id="sendbtn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userinput");
      const msg = input.value.trim();
      if (!msg) return;
      input.value = "";
      addMessage(msg, "user");
      addTyping();
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        removeTyping();
        addMessage(data.reply, "sakhi");
      } catch(e) {
        removeTyping();
        addMessage("Sorry something went wrong!", "sakhi");
      }
    }

    function quickAsk(msg) {
      document.getElementById("userinput").value = msg;
      sendMessage();
    }

    function openComplaint() {
      const complaint = prompt("Type your complaint here — it will be sent anonymously to hostel office:");
      if (complaint && complaint.trim()) {
        addMessage("🚨 Submitting complaint anonymously...", "user");
        addTyping();
        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: complaint, is_complaint: true })
        })
        .then(res => res.json())
        .then(data => {
          removeTyping();
          addMessage(data.reply, "sakhi");
        });
      }
    }

    function addMessage(text, sender) {
      const box = document.getElementById("chatbox");
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function addTyping() {
      const box = document.getElementById("chatbox");
      const div = document.createElement("div");
      div.className = "msg sakhi typing-dots";
      div.id = "typing";
      div.innerHTML = "<span></span><span></span><span></span>";
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function removeTyping() {
      document.getElementById("typing")?.remove();
    }
  </script>

</body>
</html>
